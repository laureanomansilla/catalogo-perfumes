<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fragance of the Viking — Catálogo</title>
  <meta name="description" content="Perfumes originales y decants al mejor precio. Mirá el catálogo completo y consultá por Instagram.">

  <!--
    Vista previa al compartir el link (WhatsApp, Instagram, Facebook, etc).
    Si cambiás el nombre o el eslogan en js/config.js, actualizá también
    estas etiquetas para que la vista previa quede igual.
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Fragance of the Viking">
  <meta property="og:title" content="Fragance of the Viking — Catálogo">
  <meta property="og:description" content="Perfumes originales y decants al mejor precio.">
  <meta property="og:image" content="https://laureanomansilla.github.io/catalogo-perfumes/images/logo.png">
  <meta property="og:url" content="https://laureanomansilla.github.io/catalogo-perfumes/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Fragance of the Viking — Catálogo">
  <meta name="twitter:description" content="Perfumes originales y decants al mejor precio.">
  <meta name="twitter:image" content="https://laureanomansilla.github.io/catalogo-perfumes/images/logo.png">

  <link rel="icon" href="images/logo.png" onerror="this.remove()">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <img id="brand-logo" class="logo" src="images/logo.png" alt="Fragance of the Viking" onerror="this.style.display='none'">
        <div>
          <h1 id="brand-name">Fragance of the Viking</h1>
          <p id="brand-slogan" class="slogan">Perfumes originales y decants al mejor precio</p>
        </div>
      </div>
      <a id="instagram-link" class="ig-button" href="#" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="6" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2"/>
          <circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"/>
        </svg>
        <span>Seguinos</span>
      </a>
    </div>
  </header>

  <main class="container">

    <section class="newsletter">
      <iframe
        src="https://93d1ba30.sibforms.com/v2/serve/MUIFAGXFqaPKwJIABq2H_AssWh6yvCUqOw8zQDyH0bYobu9Jbjc4D04dy6ZtkfiVXKZtLhKfjMNWFrCX-mQnzwbm07PTKqCbbk1wCUvYrYedUEhxnZzylXUX4QehwCDj0LHMc76bN2hgttNXZXwsZT6dbFKoXmlm9irACt0aQoGYcMN7AqYi9Ui2zWYvVPny2t1Swo0-lhYFG87z_g=="
        title="Suscribite para recibir promociones"
        loading="lazy"
        frameborder="0"
        scrolling="auto"
        allowfullscreen
      ></iframe>
    </section>

    <section class="filters">
      <input type="text" id="filtro-busqueda" placeholder="Buscar por nombre o marca..." aria-label="Buscar" />

      <select id="filtro-tipo" aria-label="Filtrar por tipo">
        <option value="todos">Todos los tipos</option>
        <option value="Decant">Decants</option>
        <option value="Perfume">Perfumes completos</option>
      </select>

      <select id="filtro-genero" aria-label="Filtrar por género">
        <option value="todos">Todos los géneros</option>
        <option value="Hombre">Hombre</option>
        <option value="Mujer">Mujer</option>
        <option value="Unisex">Unisex</option>
      </select>

      <select id="filtro-marca" aria-label="Filtrar por marca">
        <option value="todas">Todas las marcas</option>
      </select>

      <select id="orden" aria-label="Ordenar por">
        <option value="destacados">Destacados primero</option>
        <option value="nombre-asc">Nombre (A-Z)</option>
        <option value="precio-asc">Precio (menor a mayor)</option>
        <option value="precio-desc">Precio (mayor a menor)</option>
      </select>

      <label class="checkbox-agotados">
        <input type="checkbox" id="filtro-agotados" />
        Mostrar agotados
      </label>
    </section>

    <p id="contador-resultados" class="contador"></p>

    <section id="grilla-productos" class="grid"></section>

    <p id="sin-resultados" class="sin-resultados" hidden>No encontramos productos con esos filtros.</p>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="anio"></span> <span class="footer-brand"></span> — Catálogo hecho con ♥</p>
      <p class="footer-note">Los precios y disponibilidad pueden variar. Consultanos por Instagram.</p>
    </div>
  </footer>

  <div id="toast" class="toast" hidden></div>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-nombre">
      <button id="modal-cerrar" class="modal-cerrar" aria-label="Cerrar">&times;</button>
      <div class="modal-img-wrap">
        <img id="modal-img" src="" alt="" />
      </div>
      <div class="modal-body">
        <span id="modal-marca" class="card-marca"></span>
        <h3 id="modal-nombre" class="modal-nombre"></h3>
        <span id="modal-genero" class="card-genero"></span>
        <p id="modal-desc" class="card-desc"></p>
        <div id="modal-notas-wrap" class="modal-notas-wrap" hidden>
          <span class="modal-notas-titulo">Notas olfativas</span>
          <p id="modal-notas" class="modal-notas"></p>
        </div>
        <div id="modal-opciones" class="opciones"></div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
